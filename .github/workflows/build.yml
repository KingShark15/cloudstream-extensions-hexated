name: Build

on:
  push:
    branches: [ maestro ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Force Gradle Wrapper 8.2
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.2 --no-daemon

      - name: Build Plugins
        run: ./gradlew makePlugins --no-daemon --rerun-tasks

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: builds
          single-commit: true
